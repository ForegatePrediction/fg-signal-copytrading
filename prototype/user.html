<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f8">
<title>Signal Desk · 用户端原型</title>
<style>
:root {color-scheme:light;--bg:#f8f8f8;--ink:#18191b;--muted:#666970;--line:#e7e7e9;--accent:#fb4827;--soft:#fff0eb}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.55 Inter,"PingFang SC","Microsoft YaHei",sans-serif}
h1,h2,h3,p{margin:0}button,input,select{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #be492e;outline-offset:3px}
header,.card,dialog{background:#fff}header,.navline{border-bottom:1px solid var(--line)}
.bar,nav,main{max-width:1220px;margin:auto;padding-inline:clamp(16px,3vw,44px)}.bar,.wordmark,.identity,.navbtn,.head,h2,.actions,.pair,.sport,time,.primary,.micro{display:flex;align-items:center;gap:8px}
.bar{height:64px;gap:14px}.brand{font-size:22px;font-weight:800;letter-spacing:-1.2px;color:var(--accent)}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--accent)}.bars{display:flex;align-items:center;gap:3px;transform:skew(-13deg)}.bars i{width:3px;height:10px;background:white;border-radius:1px}.bars i:nth-child(2){height:19px}.bars i:last-child{height:14px}.brand-divider{height:17px;border-left:1px solid #d4d4d4}.product{font-weight:600}.demo{margin-left:auto;font-size:12px;color:var(--muted)}.identity,.secondary,.close{border:0;background:#f3f3f5;border-radius:9px;padding:7px 12px}.identity{font-size:13px}.identity span{display:flex;color:#287eaa}
nav{display:flex;gap:22px}.navbtn{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--muted);font-weight:600}.navbtn[aria-current=page]{border-color:var(--accent);color:var(--ink)}.navbtn[aria-current=page] .icon{color:var(--accent)}.icon{width:19px;height:19px;flex:none}main{padding-block:24px 60px}h1{font-size:clamp(25px,3vw,34px);letter-spacing:-1.4px;margin-bottom:18px}h2{font-size:20px;letter-spacing:-.6px}h3{font-size:18px}.head,.actions,.pair{justify-content:space-between}.head{margin-bottom:14px}.head h2 .icon{color:var(--accent)}small,.notice,.sub,.pair span,time{color:var(--muted)}
.topgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr);gap:16px}.card,.hero{border-radius:15px;overflow:hidden}.card{border:1px solid var(--line);padding:20px}.hero{position:relative;isolation:isolate;display:flex;align-items:center;padding:28px;background:linear-gradient(110deg,#181819 25%,#301c1a 65%,#843322);color:white}.court{position:absolute;right:0;top:0;height:100%;width:48%;z-index:-1;mask-image:linear-gradient(to right,transparent,#000 24%)}.hero-content{width:72%}.micro{font-size:12px;color:#f4e1da}.dot,.badge:before{height:6px;width:6px;border-radius:50%;background:#ff7759}.hero h2{font-size:clamp(25px,3vw,36px);margin:12px 0 6px}.hero p{color:#e1dad8;font-size:14px}.primary,.secondary{font-weight:600;justify-content:center}.primary{background:var(--accent);color:white;border:0;border-radius:9px;padding:10px 16px}.hero .primary{margin-top:22px}.primary:hover{background:#d63a1e}.textbtn{background:none;border:0;color:#94422d;padding:7px 9px}.badge{font-size:12px;border-radius:6px;color:#63666a;background:#f1f2f4;padding:3px 8px}.badge.active{color:#007e59;background:#e4f7ee}.pair{padding:9px 0;border-bottom:1px solid var(--line)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:13px 0}.num{font-variant-numeric:tabular-nums;font-size:26px;font-weight:700}.config .textbtn{margin-left:5px}.feed{margin-top:28px}.signals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sport{font-size:13px;font-weight:650}.tile{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:#087658;background:#e3f6ed}.tile.b{color:#b65a12;background:#fff0d9}.tile.c{color:#65791b;background:#eff4d5}.signal time{font-size:12px}.signal time .icon{width:14px;height:14px}.pick{background:#fff2ed;border-radius:7px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}.pick strong{font-size:14px;color:#ab381c}.board{max-width:810px}.filters{display:flex;flex-wrap:wrap;gap:7px}.filters button{border:0;border-radius:7px;padding:6px 11px;background:#f5f5f5}.filters .sel{background:var(--soft);color:#a93419}.empty{text-align:center;padding:34px 0}.empty>.icon{color:var(--accent);width:32px;height:32px;margin:8px}.empty p{color:var(--muted);margin:6px 0 15px}.orderbtn{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:15px 0;margin-top:10px}
dialog{color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(430px,calc(100vw - 28px));max-height:85dvh}dialog::backdrop{background:#16161970}dialog .actions{margin-top:18px;justify-content:flex-end}.close{font-size:20px;line-height:1;padding:7px 10px}label{display:block;font-weight:600;margin:14px 0 4px}input,select{width:100%;padding:10px;border:1px solid #c6c6cc;border-radius:8px;background:white;color:var(--ink)}.error{color:#b12c12}.notice,.sub{font-size:14px;margin:10px 0}.toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#222;color:white;border-radius:18px;padding:7px 14px;z-index:5}.toast.on{display:block}
@media(max-width:720px){.bar{height:54px;gap:8px}.brand{font-size:19px}.product,.brand-divider{display:none}.identity{font-size:12px;padding:6px 9px}.topgrid,.signals{grid-template-columns:1fr}.topgrid{gap:12px}.hero{padding:22px}.hero-content{width:82%}.court{width:42%;opacity:.75}.card{padding:16px}.signal .head{margin-bottom:8px}.feed{margin-top:20px}.bar .demo{font-size:11px}nav{position:fixed;bottom:0;inset-inline:0;background:white;border-top:1px solid var(--line);padding:5px 10px calc(5px + env(safe-area-inset-bottom));justify-content:space-around;z-index:4;gap:0}.navbtn{flex:1;flex-direction:column;gap:2px;border:0;padding:3px;font-size:12px}.navbtn[aria-current=page]{color:#b73419}main{padding-block:18px 94px}.toast{bottom:76px}.stats{padding:9px 0}}
[hidden]{display:none!important}.auth{margin:clamp(14px,6vh,64px) auto;width:min(100%,450px);padding:clamp(20px,5vw,34px)}.auth h1{margin:18px 0 8px;font-size:28px}.connect{display:flex;align-items:center;gap:14px;color:#999}.connect .tile{width:42px;height:42px;background:#e8f5fd;color:#1786b5}.connect .logo{width:42px;height:42px}.auth label{margin-top:22px}.auth input{font-size:16px}.auth .primary{margin-top:22px;width:100%}.auth .notice{font-size:13px}.identity{max-width:42vw}.identity-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile-name{overflow-wrap:anywhere}.auth .pair{margin-top:16px}
dialog{width:min(510px,calc(100vw - 24px))}.library{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.library article,.signals article{display:flex;flex-direction:column;gap:9px}.library article .actions{margin-top:auto}.meta{display:flex;align-items:center;gap:7px;justify-content:space-between;color:var(--muted);font-size:12px}.market-title{font-size:17px;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar input{max-width:360px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.formgrid input{min-width:0}.book{margin:12px 0;background:#f6f6f8;padding:12px;border-radius:9px}.num{font-variant-numeric:tabular-nums}.raw{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;background:#f7f7f8;padding:12px;border-radius:9px}.listrow{display:block;width:100%;background:white;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0}.fundhero{background:var(--ink);color:white;padding:24px;border-radius:14px;margin-bottom:14px}.fundhero .num{font-size:34px}.fundhero .actions{justify-content:flex-start;margin-top:14px}.fundhero .secondary{color:var(--ink)}.link{color:#a63d27}.reason{color:#98451b}.sheeterr{color:#aa331a;min-height:1em}.summary{overflow-wrap:anywhere}select{max-width:100%}.orderbtn small{display:block}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.auth input,.toolbar input{min-width:0}.signals .textbtn{text-align:left}button:disabled{opacity:.5;cursor:default}
</style>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<a class="skip" href="#main" onclick="event.preventDefault();document.querySelector('main').focus()">跳到主要内容</a>
<header>
  <div class="bar">
    <div class="wordmark"><span class="logo" aria-hidden="true"><span class="bars"><i></i><i></i><i></i></span></span><span class="brand">Signal Desk</span><span class="brand-divider"></span><span class="product">信号跟单</span></div>
    <nav aria-label="主导航"></nav><button class="identity" data-act="account" aria-label="我的 Telegram 身份"><span id="tgIcon"></span><b class="identity-name"></b></button>
  </div>
</header>
<main id="main" tabindex="-1"></main><dialog id="sheet"><div id="inner"></div></dialog><div role="status" id="toast" class="toast"></div>
<script src="catalog.js"></script>
<script src="qr.js"></script>
<script src="desk.js"></script></body></html>
