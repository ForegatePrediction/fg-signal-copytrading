<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>ForeGate API 工作台</title>
  <link rel="stylesheet" href="api.css">
  <script defer src="api.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><div><strong>信号跟单</strong><span>ForeGate API</span></div></div>
    <nav aria-label="主导航">
      <button data-page="overview" disabled><span aria-hidden="true">◫</span>账户概览</button>
      <button data-page="market" disabled><span aria-hidden="true">◈</span>市场交易</button>
      <button data-page="positions" disabled><span aria-hidden="true">▤</span>持仓</button>
      <button data-page="orders" disabled><span aria-hidden="true">≋</span>订单与成交</button>
      <button data-page="funds" disabled><span aria-hidden="true">⇄</span>充值提现</button>
      <button data-page="follow" disabled><span aria-hidden="true">◉</span>自动跟单</button>
      <button data-page="connection" disabled><span aria-hidden="true">⚙</span>连接设置</button>
    </nav>
    <div class="side-footer"><button id="guide-open" type="button">新手指引</button><a href="https://docs.forepaas.org/">ForeGate API 文档 ↗</a><span id="client-version">macOS 客户端 · 0.8.3</span></div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <span class="environment"><span class="dot" aria-hidden="true"></span> 实盘账户</span>
      <div class="top-actions"><span id="connection-status">API 未连接</span><span id="account" hidden></span><button id="account-picker" class="compact">账户</button><button id="refresh" class="compact" title="刷新当前页面">刷新</button></div>
    </header>
    <main>
      <div class="heading"><h1 id="title">ForeGate API 账户</h1></div>
      <div id="notice" role="status" hidden></div>
      <div id="content" aria-busy="true"></div>
    </main>
  </div>
  <dialog id="guide" aria-labelledby="guide-title" aria-describedby="guide-body">
    <div class="guide-inner">
      <div class="flex"><span class="environment" id="guide-progress"></span><button type="button" id="guide-skip" class="compact push">跳过指引</button></div>
      <h2 id="guide-title"></h2>
      <p id="guide-body"></p>
      <p id="guide-error" class="amber" role="status" hidden></p>
      <div class="flex"><button type="button" id="guide-back">上一步</button><button type="button" class="primary push" id="guide-next">下一步</button></div>
    </div>
  </dialog>
</body>
</html>
